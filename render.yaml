# Static site — no server, no environment variables needed. This app is
# entirely client-side (WebUSB, File System Access API, browser storage
# estimates), which also means it needs HTTPS to work properly — Render
# serves static sites over HTTPS by default, so that's satisfied automatically.
services:
  - type: web
    name: device-inspector
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
